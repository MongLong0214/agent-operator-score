<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AOS가 보는 여섯 영역</title>
  <desc id="desc">과제 명세, 컨텍스트 엔지니어링, 분해와 라우팅, 휴먼인더루프 제어, 평가와 검증, 가드레일 복구 비용을 쉬운 질문으로 설명합니다.</desc>
  <rect width="1200" height="650" fill="#f0f1ee"/>
  <g font-family="system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <g transform="translate(30 30)">
      <rect width="360" height="270" rx="12" fill="#0f5132"/>
      <text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2">D1 · TASK SPECIFICATION</text>
      <text x="30" y="105" fill="#fff" font-size="31" font-weight="800">뭘 만들지 말했나</text>
      <text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">목표, 하지 말 것,</tspan><tspan x="30" dy="34">다 됐다고 할 조건.</tspan></text>
    </g>
    <g transform="translate(420 30)">
      <rect width="360" height="270" rx="12" fill="#0f5132"/>
      <text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2">D2 · CONTEXT ENGINEERING</text>
      <text x="30" y="105" fill="#fff" font-size="31" font-weight="800">뭘 보여 줬나</text>
      <text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">맞는 자료를 골랐나,</tspan><tspan x="30" dy="34">낡거나 수상한 건 걸렀나.</tspan></text>
    </g>
    <g transform="translate(810 30)">
      <rect width="360" height="270" rx="12" fill="#0f5132"/>
      <text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2">D3 · DECOMPOSITION &amp; ROUTING</text>
      <text x="30" y="105" fill="#fff" font-size="31" font-weight="800">일을 어떻게 쪼갰나</text>
      <text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">누구에게 뭘 맡기고,</tspan><tspan x="30" dy="34">결과를 어떻게 합쳤나.</tspan></text>
    </g>
    <g transform="translate(30 330)">
      <rect width="360" height="270" rx="12" fill="#0f5132"/>
      <text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="1.5">D4 · HUMAN-IN-THE-LOOP CONTROL</text>
      <text x="30" y="105" fill="#fff" font-size="31" font-weight="800">막혔을 때 뭘 했나</text>
      <text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">알아챘나, 지시를 바꿨나,</tspan><tspan x="30" dy="34">멈춰야 할 때 멈췄나.</tspan></text>
    </g>
    <g transform="translate(420 330)">
      <rect width="360" height="270" rx="12" fill="#0f5132"/>
      <text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="1.5">D5 · EVALUATION &amp; VERIFICATION</text>
      <text x="30" y="105" fill="#fff" font-size="31" font-weight="800">진짜 되는지 봤나</text>
      <text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">“다 됐습니다”라는 말을</tspan><tspan x="30" dy="34">별도 근거로 확인했나.</tspan></text>
    </g>
    <g transform="translate(810 330)">
      <rect width="360" height="270" rx="12" fill="#0f5132"/>
      <text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="1.5">D6 · GUARDRAILS, RECOVERY &amp; COST</text>
      <text x="30" y="105" fill="#fff" font-size="31" font-weight="800">안전하고 싸게 했나</text>
      <text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">비밀, 권한, 복구 방법,</tspan><tspan x="30" dy="34">호출 예산을 지켰나.</tspan></text>
    </g>
  </g>
</svg>
