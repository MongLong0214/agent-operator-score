<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">The six dimensions AOS observes</title><desc id="desc">Task specification, context engineering, decomposition and routing, human-in-the-loop control, evaluation and verification, and guardrails recovery and cost, expressed as practical questions.</desc><style> :root { color-scheme: light dark; } .bg { fill: #f0f1ee; } .panel { fill: #ffffff; stroke: #d5d8d2; } .ink { fill: #1a1c1a; } .muted { fill: #5b615c; } .sign { fill: #0f5132; } .sign-stroke { stroke: #0f5132; } .sign-ink { fill: #ffffff; color: #ffffff; } .line { stroke: #f2b705; } .stop { fill: #a8322a; } .stop-stroke { stroke: #a8322a; } .dash { stroke: #b7bdb7; } @media (prefers-color-scheme: dark) { .bg { fill: #141618; } .panel { fill: #1c1f21; stroke: #343a3d; } .ink { fill: #eceee9; } .muted { fill: #a9b0aa; } .sign { fill: #3f9a6b; } .sign-stroke { stroke: #3f9a6b; } .sign-ink { fill: #0b1410; color: #0b1410; } .stop { fill: #e0796e; } .stop-stroke { stroke: #e0796e; } .dash { stroke: #555d58; } } text { font-family: system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; } .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; } </style><rect class="bg" width="1200" height="650"/><g transform="translate(30 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D1 · TASK SPECIFICATION</text><text x="30" y="101" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">What did you</tspan><tspan x="30" dy="36">ask for?</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">Goal, non-goals,</tspan><tspan x="30" dy="32">and definition of done.</tspan></text></g><g transform="translate(420 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D2 · CONTEXT ENGINEERING</text><text x="30" y="101" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">What context</tspan><tspan x="30" dy="36">did you give?</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">Relevant, current,</tspan><tspan x="30" dy="32">trustworthy sources.</tspan></text></g><g transform="translate(810 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D3 · DECOMPOSITION &amp; ROUTING</text><text x="30" y="101" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">How did you</tspan><tspan x="30" dy="36">divide the work?</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">Owners, dependencies,</tspan><tspan x="30" dy="32">handoffs, and joins.</tspan></text></g><g transform="translate(30 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D4 · HUMAN-IN-THE-LOOP CONTROL</text><text x="30" y="101" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">What did you do</tspan><tspan x="30" dy="36">when it got stuck?</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">Notice, change course,</tspan><tspan x="30" dy="32">or stop.</tspan></text></g><g transform="translate(420 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D5 · EVALUATION &amp; VERIFICATION</text><text x="30" y="101" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">Did you verify</tspan><tspan x="30" dy="36">that it works?</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">Check “done” against</tspan><tspan x="30" dy="32">independent evidence.</tspan></text></g><g transform="translate(810 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D6 · GUARDRAILS, RECOVERY &amp; COST</text><text x="30" y="101" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">Was it safe</tspan><tspan x="30" dy="36">and efficient?</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">Secrets, permissions,</tspan><tspan x="30" dy="32">recovery, and budget.</tspan></text></g></svg>
