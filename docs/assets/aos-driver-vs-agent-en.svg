<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Not the car. The driver.</title><desc id="desc">The agent is shown as a car, the operator as the driver, and the scorecard points to the operator.</desc><style> :root { color-scheme: light dark; } .bg { fill: #f0f1ee; } .panel { fill: #ffffff; stroke: #d5d8d2; } .ink { fill: #1a1c1a; } .muted { fill: #5b615c; } .sign { fill: #0f5132; } .sign-stroke { stroke: #0f5132; } .sign-ink { fill: #ffffff; color: #ffffff; } .line { stroke: #f2b705; } .stop { fill: #a8322a; } .stop-stroke { stroke: #a8322a; } .dash { stroke: #b7bdb7; } @media (prefers-color-scheme: dark) { .bg { fill: #141618; } .panel { fill: #1c1f21; stroke: #343a3d; } .ink { fill: #eceee9; } .muted { fill: #a9b0aa; } .sign { fill: #3f9a6b; } .sign-stroke { stroke: #3f9a6b; } .sign-ink { fill: #0b1410; color: #0b1410; } .stop { fill: #e0796e; } .stop-stroke { stroke: #e0796e; } .dash { stroke: #555d58; } } text { font-family: system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; } .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; } </style><rect class="bg" width="1200" height="380"/><rect x="24" y="250" width="1152" height="18" class="dash" opacity=".35"/><g class="line" stroke-width="9" stroke-linecap="round"><path d="M52 259h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78"/></g><g class="panel" stroke-width="7" stroke-linejoin="round"><path d="M115 244v-45c0-10 8-18 18-18h45l37-47h105l23 47h41c10 0 18 8 18 18v45"/><circle cx="181" cy="244" r="24"/><circle cx="336" cy="244" r="24"/></g><g class="panel" stroke-width="7" stroke-linecap="round"><circle cx="650" cy="116" r="40"/><path d="M588 244v-42c0-44 28-72 62-72s62 28 62 72v42"/></g><g><rect x="886" y="72" width="236" height="178" rx="10" class="sign"/><g stroke-width="8" stroke-linecap="round" opacity=".86" class="sign-ink"><path d="M926 120h154M926 159h154M926 198h106" stroke="currentColor"/></g><path d="M878 159H772" class="sign-stroke" stroke-width="9" stroke-linecap="round"/><path d="M798 137l-24 22 24 22" fill="none" class="sign-stroke" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><g font-size="27" font-weight="700" text-anchor="middle"><text x="258" y="310" class="muted">Agent</text><text x="650" y="310" class="muted">Operator · You</text><text x="1004" y="310" class="sign">Scorecard</text></g><text x="36" y="354" class="muted" font-size="20">The scorecard points to the driver, not the car.</text></svg>
