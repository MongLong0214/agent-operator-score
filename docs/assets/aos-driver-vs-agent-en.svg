      <path d="M926 120h154M926 159h154M926 198h106"/>
    </g>
    <path d="M878 159H772" stroke="#0f5132" stroke-width="9" stroke-linecap="round"/>
    <path d="M798 137l-24 22 24 22" fill="none" stroke="#0f5132" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <text x="258" y="310" fill="#5b615c">Agent</text>
    <text x="650" y="310" fill="#5b615c">Operator · you</text>
    <text x="1004" y="310" fill="#0f5132">Scorecard</text>
  </g>
  <text x="36" y="354" fill="#5b615c" font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif" font-size="20">The scorecard points to the driver, not the car.</text>
