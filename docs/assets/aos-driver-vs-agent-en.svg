<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">The driver, not the car</title>
  <desc id="desc">The agent is shown as a car, the operator as the driver, and the scorecard points to the driver.</desc>
