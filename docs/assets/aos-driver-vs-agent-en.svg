  <rect x="24" y="250" width="1152" height="18" fill="#d5d8d2"/>
  <g stroke="#f2b705" stroke-width="9" stroke-linecap="round">
    <path d="M52 259h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78"/>
  </g>
  <g fill="#fff" stroke="#1a1c1a" stroke-width="7" stroke-linejoin="round">
    <path d="M115 244v-45c0-10 8-18 18-18h45l37-47h105l23 47h41c10 0 18 8 18 18v45"/>
    <circle cx="181" cy="244" r="24"/>
    <circle cx="336" cy="244" r="24"/>
  </g>
  <g fill="#fff" stroke="#1a1c1a" stroke-width="7" stroke-linecap="round">
    <circle cx="650" cy="116" r="40"/>
    <path d="M588 244v-42c0-44 28-72 62-72s62 28 62 72v42"/>
  </g>
  <g>
    <rect x="886" y="72" width="236" height="178" rx="10" fill="#0f5132"/>
