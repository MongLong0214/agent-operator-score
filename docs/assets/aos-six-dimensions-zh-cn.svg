<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">AOS 观察的六个维度</title><desc id="desc">用实际问题说明任务规格、上下文工程、任务拆分与路由、人在回路控制、评估与验证，以及护栏、恢复与成本。</desc><style> :root { color-scheme: light dark; } .bg { fill: #f0f1ee; } .panel { fill: #ffffff; stroke: #d5d8d2; } .ink { fill: #1a1c1a; } .muted { fill: #5b615c; } .sign { fill: #0f5132; } .sign-stroke { stroke: #0f5132; } .sign-ink { fill: #ffffff; color: #ffffff; } .line { stroke: #f2b705; } .stop { fill: #a8322a; } .stop-stroke { stroke: #a8322a; } .dash { stroke: #b7bdb7; } @media (prefers-color-scheme: dark) { .bg { fill: #141618; } .panel { fill: #1c1f21; stroke: #343a3d; } .ink { fill: #eceee9; } .muted { fill: #a9b0aa; } .sign { fill: #3f9a6b; } .sign-stroke { stroke: #3f9a6b; } .sign-ink { fill: #0b1410; color: #0b1410; } .stop { fill: #e0796e; } .stop-stroke { stroke: #e0796e; } .dash { stroke: #555d58; } } text { font-family: system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; } .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; } </style><rect class="bg" width="1200" height="650"/><g transform="translate(30 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D1 · TASK SPECIFICATION</text><text x="30" y="115" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">让它做什么</tspan></text><text x="30" y="168" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">目标、不做什么、</tspan><tspan x="30" dy="32">什么算完成。</tspan></text></g><g transform="translate(420 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D2 · CONTEXT ENGINEERING</text><text x="30" y="115" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">给它看什么</tspan></text><text x="30" y="168" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">相关、最新、</tspan><tspan x="30" dy="32">可信的资料。</tspan></text></g><g transform="translate(810 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D3 · DECOMPOSITION &amp; ROUTING</text><text x="30" y="115" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">如何拆分任务</tspan></text><text x="30" y="168" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">负责人、依赖、</tspan><tspan x="30" dy="32">交接与汇合。</tspan></text></g><g transform="translate(30 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D4 · HUMAN-IN-THE-LOOP CONTROL</text><text x="30" y="115" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">卡住时做了什么</tspan></text><text x="30" y="168" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">是否发现问题、改变方向，</tspan><tspan x="30" dy="32">该停时是否停下。</tspan></text></g><g transform="translate(420 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D5 · EVALUATION &amp; VERIFICATION</text><text x="30" y="115" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">是否真的验证过</tspan></text><text x="30" y="168" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">是否用独立证据</tspan><tspan x="30" dy="32">核对“完成”。</tspan></text></g><g transform="translate(810 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D6 · GUARDRAILS, RECOVERY &amp; COST</text><text x="30" y="115" class="sign-ink" font-size="29" font-weight="800"><tspan x="30">是否安全且节省</tspan></text><text x="30" y="168" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">密钥、权限、恢复方式、</tspan><tspan x="30" dy="32">调用预算。</tspan></text></g></svg>
