<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AOS关注的六个方面</title>
  <desc id="desc">用六个简单问题说明任务定义、上下文、拆分分派、人工介入、验证以及安全恢复成本。</desc>
  <rect width="1200" height="650" fill="#f0f1ee"/>
  <g font-family="system-ui,-apple-system,'Microsoft YaHei','PingFang SC',sans-serif">
    <g transform="translate(30 30)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,monospace" font-size="15" font-weight="700">D1 · TASK SPECIFICATION</text><text x="30" y="105" fill="#fff" font-size="31" font-weight="800">任务说清楚了吗</text><text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">目标、禁止事项、</tspan><tspan x="30" dy="34">什么才算完成。</tspan></text></g>
    <g transform="translate(420 30)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,monospace" font-size="15" font-weight="700">D2 · CONTEXT ENGINEERING</text><text x="30" y="105" fill="#fff" font-size="31" font-weight="800">给了哪些上下文</text><text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">资料是否正确，</tspan><tspan x="30" dy="34">过期或可疑内容是否排除。</tspan></text></g>
    <g transform="translate(810 30)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,monospace" font-size="14" font-weight="700">D3 · DECOMPOSITION &amp; ROUTING</text><text x="30" y="105" fill="#fff" font-size="30" font-weight="800">怎样拆分和分派</text><text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">谁负责什么，</tspan><tspan x="30" dy="34">结果怎样合并。</tspan></text></g>
    <g transform="translate(30 330)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,monospace" font-size="13" font-weight="700">D4 · HUMAN-IN-THE-LOOP CONTROL</text><text x="30" y="105" fill="#fff" font-size="30" font-weight="800">卡住时做了什么</text><text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">发现失败了吗，改指令了吗，</tspan><tspan x="30" dy="34">该停时停了吗。</tspan></text></g>
    <g transform="translate(420 330)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,monospace" font-size="13" font-weight="700">D5 · EVALUATION &amp; VERIFICATION</text><text x="30" y="105" fill="#fff" font-size="28" font-weight="800">确认真的能用吗</text><text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">有没有用独立证据</tspan><tspan x="30" dy="34">核对“已经完成”。</tspan></text></g>
    <g transform="translate(810 330)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="48" fill="#d7eadf" font-family="ui-monospace,monospace" font-size="13" font-weight="700">D6 · GUARDRAILS, RECOVERY &amp; COST</text><text x="30" y="105" fill="#fff" font-size="27" font-weight="800">安全且不过度消耗吗</text><text x="30" y="156" fill="#e5f1e9" font-size="21"><tspan x="30">秘密、权限、恢复方式、</tspan><tspan x="30" dy="34">调用预算是否受控。</tspan></text></g>
  </g>
</svg>
