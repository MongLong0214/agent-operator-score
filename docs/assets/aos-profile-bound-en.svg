<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Two scores of 83 are not automatically comparable</title><desc id="desc">Two scores of 83 from different agents, isolation levels, seeds, and task packs are different measurements.</desc><style> :root { color-scheme: light dark; } .bg { fill: #f0f1ee; } .panel { fill: #ffffff; stroke: #d5d8d2; } .ink { fill: #1a1c1a; } .muted { fill: #5b615c; } .sign { fill: #0f5132; } .sign-stroke { stroke: #0f5132; } .sign-ink { fill: #ffffff; color: #ffffff; } .line { stroke: #f2b705; } .stop { fill: #a8322a; } .stop-stroke { stroke: #a8322a; } .dash { stroke: #b7bdb7; } @media (prefers-color-scheme: dark) { .bg { fill: #141618; } .panel { fill: #1c1f21; stroke: #343a3d; } .ink { fill: #eceee9; } .muted { fill: #a9b0aa; } .sign { fill: #3f9a6b; } .sign-stroke { stroke: #3f9a6b; } .sign-ink { fill: #0b1410; color: #0b1410; } .stop { fill: #e0796e; } .stop-stroke { stroke: #e0796e; } .dash { stroke: #555d58; } } text { font-family: system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; } .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; } </style><rect class="bg" width="1200" height="330"/><rect x="34" y="34" width="500" height="230" rx="12" class="panel" stroke-width="3"/><text x="76" y="112" class="sign" font-size="66" font-weight="800">83</text><g class="muted mono" font-size="21"><text x="76" y="158">codex · isolation on</text><text x="76" y="194">seed 7c8f75…</text><text x="76" y="230">task pack 690042…</text></g><text x="600" y="170" text-anchor="middle" class="muted" font-size="52" font-weight="800">≠</text><rect x="666" y="34" width="500" height="230" rx="12" class="panel" stroke-width="3"/><text x="708" y="112" class="sign" font-size="66" font-weight="800">83</text><g class="muted mono" font-size="21"><text x="708" y="158">claude · isolation off</text><text x="708" y="194">seed a41b9c…</text><text x="708" y="230">task pack c73e18…</text></g><text x="600" y="306" text-anchor="middle" class="muted" font-size="20">Same number, different test · PROFILE-BOUND</text></svg>
