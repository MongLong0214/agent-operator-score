<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Not observed is not zero</title>
  <desc id="desc">Only three of twenty metrics were observed. AOS withholds the score instead of treating missing evidence as failure.</desc>
  <rect width="1200" height="330" fill="#f0f1ee"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif">
    <text x="52" y="48" fill="#5b615c" font-size="22" font-weight="700">Observed 3 / 20</text>
    <g><rect x="52" y="84" width="42" height="42" rx="5" fill="#0f5132"/><rect x="108" y="84" width="42" height="42" rx="5" fill="#0f5132"/><rect x="164" y="84" width="42" height="42" rx="5" fill="#0f5132"/><rect x="220" y="84" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="276" y="84" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="332" y="84" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="388" y="84" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="444" y="84" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="500" y="84" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="556" y="84" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="52" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="108" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="164" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="220" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="276" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="332" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="388" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="444" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="500" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/><rect x="556" y="140" width="42" height="42" rx="5" fill="none" stroke="#aeb4ad" stroke-width="3" stroke-dasharray="6 5"/></g>
    <text x="52" y="232" fill="#5b615c" font-size="19">Dashed = not observed, not failed.</text>
    <g transform="translate(718 72) rotate(-2)">
      <rect width="410" height="86" rx="8" fill="none" stroke="#a8322a" stroke-width="5"/>
      <text x="205" y="56" text-anchor="middle" fill="#a8322a" font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="850">NO SCORE</text>
    </g>
    <rect x="718" y="196" width="410" height="76" rx="8" fill="#fff" stroke="#d5d8d2" stroke-width="2"/>
    <text x="923" y="244" text-anchor="middle" fill="#1a1c1a" font-size="24" font-weight="750">Silence is not a pass.</text>
  </g>
</svg>
