<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img"
     aria-label="AOS assessment pipeline: a declared profile and a locked seed produce a controlled run; the run stops at an operator checkpoint and a hidden verifier grades what the agents produced; twenty metrics feed the contract's evaluation, an issuance gate decides which constructs and domains may be issued, and a cycle of profile runs reports its runs rather than one operator score.">
  <title>AOS assessment pipeline</title>
  <style>
    :root { color-scheme: light dark; }
    .bg     { fill: #ffffff; }
    .card   { fill: #f8fafc; stroke: #e2e8f0; }
    .card2  { fill: #eff6ff; stroke: #bfdbfe; }
    .built  { fill: #ecfdf5; stroke: #a7f3d0; }
    .stop   { fill: #fff7ed; stroke: #fdba74; }
    .ink    { fill: #0f172a; }
    .muted  { fill: #64748b; }
    .flow   { stroke: #94a3b8; }
    .accent { fill: #2563eb; }
    .ok     { fill: #059669; }
    .warn   { fill: #c2410c; }
    .lane   { fill: #f1f5f9; stroke: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0b1220; }
      .card   { fill: #0f172a; stroke: #1e293b; }
      .card2  { fill: #10233f; stroke: #1d4ed8; }
      .built  { fill: #062b22; stroke: #065f46; }
      .stop   { fill: #2a1608; stroke: #9a3412; }
      .ink    { fill: #e2e8f0; }
      .muted  { fill: #94a3b8; }
      .flow   { stroke: #475569; }
      .accent { fill: #60a5fa; }
      .ok     { fill: #34d399; }
      .warn   { fill: #fb923c; }
      .lane   { fill: #0d1526; stroke: #1e293b; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .h  { font-size: 14.5px; font-weight: 620; }
    .s  { font-size: 11.5px; }
    .t  { font-size: 10.5px; letter-spacing: 0.4px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="flow" fill="context-stroke" stroke="none"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="392"/>

  <rect class="lane" x="16.5" y="16.5" width="927" height="150" rx="14"/>
  <text class="muted t" x="34" y="40">DECLARED — RECORDED, NOT ASSUMED</text>

  <!-- 1. Opportunity Profile -->
  <g transform="translate(34 54)">
    <rect class="card2" x="0.5" y="0.5" width="212" height="96" rx="12"/>
    <text class="ink h" x="16" y="28">Opportunity Profile</text>
    <text class="muted s" x="16" y="50">agent · runtime version · isolation</text>
    <text class="muted s" x="16" y="68">permitted environment names</text>
    <text class="accent s" x="16" y="86">→ profile_digest</text>
  </g>
  <path class="flow" d="M250 102 H286" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2. Locked seed -->
  <g transform="translate(288 54)">
    <rect class="card2" x="0.5" y="0.5" width="196" height="96" rx="12"/>
    <text class="ink h" x="16" y="28">Locked seed</text>
    <text class="muted s" x="16" y="50">fixed once, never redrawn</text>
    <text class="muted s" x="16" y="68">scenario data · canaries</text>
    <text class="accent s" x="16" y="86">→ suite manifest</text>
  </g>
  <path class="flow" d="M488 102 H524" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3. Controlled run -->
  <g transform="translate(526 54)">
    <rect class="card" x="0.5" y="0.5" width="196" height="96" rx="12"/>
    <text class="ink h" x="16" y="28">Controlled run</text>
    <text class="muted s" x="16" y="50">isolated workspace</text>
    <text class="muted s" x="16" y="68">HOME replaced · env filtered</text>
    <text class="muted s" x="16" y="86">redaction where output is read</text>
  </g>
  <path class="flow" d="M726 102 H762" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4. Operator checkpoint -->
  <g transform="translate(764 54)">
    <rect class="stop" x="0.5" y="0.5" width="162" height="96" rx="12"/>
    <text class="ink h" x="16" y="28">Operator checkpoint</text>
    <text class="muted s" x="16" y="50">stops at a blocker</text>
    <text class="muted s" x="16" y="68">records the state change,</text>
    <text class="warn s" x="16" y="86">never the menu choice</text>
  </g>

  <path class="flow" d="M845 168 V196" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 5. Hidden verifier -->
  <g transform="translate(34 198)">
    <rect class="card" x="0.5" y="0.5" width="212" height="86" rx="12"/>
    <text class="ink h" x="16" y="28">Hidden verifier</text>
    <text class="muted s" x="16" y="50">assessed code in a subprocess</text>
    <text class="muted s" x="16" y="68">verdict authenticated by nonce</text>
  </g>

  <!-- 6. Twenty metrics -->
  <g transform="translate(288 198)">
    <rect class="card" x="0.5" y="0.5" width="196" height="86" rx="12"/>
    <text class="ink h" x="16" y="28">M01–M20</text>
    <text class="muted s" x="16" y="50">six dimensions, four checks each</text>
    <text class="muted s" x="16" y="68">observed, or NOT_OBSERVED</text>
  </g>

  <!-- 7. Deterministic scorer -->
  <g transform="translate(526 198)">
    <rect class="card" x="0.5" y="0.5" width="196" height="86" rx="12"/>
    <text class="ink h" x="16" y="28">Contract evaluation</text>
    <text class="muted s" x="16" y="50">constructs · domains · reliance</text>
    <text class="muted s" x="16" y="68">same observations, same bytes</text>
  </g>

  <!-- 8. Issuance gate -->
  <g transform="translate(764 198)">
    <rect class="built" x="0.5" y="0.5" width="162" height="86" rx="12"/>
    <text class="ink h" x="16" y="28">Issuance gate</text>
    <text class="muted s" x="16" y="50">per construct, per domain</text>
    <text class="ok s" x="16" y="68">issued, or withheld by name</text>
  </g>

  <path class="flow" d="M246 241 H286" fill="none" stroke-width="1.6" marker-end="url(#a)"/>
  <path class="flow" d="M486 241 H524" fill="none" stroke-width="1.6" marker-end="url(#a)"/>
  <path class="flow" d="M724 241 H762" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 9. Cycle -->
  <rect class="lane" x="16.5" y="304.5" width="927" height="70" rx="14"/>
  <text class="muted t" x="34" y="328">THREE LOCKED SEEDS — EVERY VALID RUN COUNTS</text>
  <text class="ink h" x="34" y="352">A cycle of profile runs reports the runs; the aggregate is withheld</text>
  <text class="muted s" x="560" y="352">no aggregation over profiles is defined yet · excluded runs are named with their reason, never as confidence</text>
</svg>
