<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"
     aria-label="AOS assessment pipeline: Opportunity Profile and controlled wrapper produce an aos-trace, the deterministic scorer produces an aos-result, and an ordered integrity, safety and issuance gate decides what may be issued.">
  <title>AOS assessment pipeline</title>
  <style>
    :root { color-scheme: light dark; }
    .bg     { fill: #ffffff; }
    .card   { fill: #f8fafc; stroke: #e2e8f0; }
    .card2  { fill: #eff6ff; stroke: #bfdbfe; }
    .built  { fill: #ecfdf5; stroke: #a7f3d0; }
    .ink    { fill: #0f172a; }
    .muted  { fill: #64748b; }
    .flow   { stroke: #94a3b8; }
    .accent { fill: #2563eb; }
    .ok     { fill: #059669; }
    .lane   { fill: #f1f5f9; stroke: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0b1220; }
      .card   { fill: #0f172a; stroke: #1e293b; }
      .card2  { fill: #10233f; stroke: #1d4ed8; }
      .built  { fill: #062b22; stroke: #065f46; }
      .ink    { fill: #e2e8f0; }
      .muted  { fill: #94a3b8; }
      .flow   { stroke: #475569; }
      .accent { fill: #60a5fa; }
      .ok     { fill: #34d399; }
      .lane   { fill: #0d1526; stroke: #1e293b; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .h  { font-size: 14.5px; font-weight: 620; }
    .s  { font-size: 11.5px; }
    .t  { font-size: 10.5px; letter-spacing: 0.4px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="flow" fill="context-stroke" stroke="none"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="330"/>

  <rect class="lane" x="16.5" y="16.5" width="927" height="228" rx="14"/>
  <text class="muted t" x="34" y="40">DECLARED ENVIRONMENT — RECORDED, NOT ASSUMED</text>

  <!-- 1. Opportunity Profile -->
  <g transform="translate(34 58)">
    <rect class="card2" x="0.5" y="0.5" width="196" height="120" rx="12"/>
    <text class="ink h" x="16" y="30">Opportunity Profile</text>
    <text class="muted s" x="16" y="52">model · runtime · harness</text>
    <text class="muted s" x="16" y="70">tools · permissions · network</text>
    <text class="muted s" x="16" y="88">context · time · budgets</text>
    <text class="muted s" x="16" y="106">intervention policy</text>
  </g>
  <path class="flow" d="M234 118 H274" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2. Controlled wrapper -->
  <g transform="translate(276 58)">
    <rect class="card" x="0.5" y="0.5" width="180" height="120" rx="12"/>
    <text class="ink h" x="16" y="30">Controlled wrapper</text>
    <text class="muted s" x="16" y="52">isolated workspace</text>
    <text class="muted s" x="16" y="70">bounded event capture</text>
    <text class="muted s" x="16" y="88">redaction at the edge</text>
    <text class="ok s" x="16" y="108">▸ start to finish, or nothing</text>
  </g>
  <path class="flow" d="M458 118 H498" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3. aos-trace -->
  <g transform="translate(500 58)">
    <rect class="card" x="0.5" y="0.5" width="176" height="120" rx="12"/>
    <text class="ink h" x="16" y="30">aos-trace</text>
    <text class="muted s" x="16" y="52">canonical event registry</text>
    <text class="muted s" x="16" y="70">secrets never stored</text>
    <text class="muted s" x="16" y="88">hidden reasoning never</text>
    <text class="muted s" x="16" y="106">stored</text>
  </g>
  <path class="flow" d="M678 118 H718" fill="none" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4. Deterministic scorer -->
  <g transform="translate(720 58)">
    <rect class="card" x="0.5" y="0.5" width="190" height="120" rx="12"/>
    <text class="ink h" x="16" y="30">Deterministic scorer</text>
    <text class="muted s" x="16" y="52">M01–M20 frozen registry</text>
    <text class="muted s" x="16" y="70">six task families</text>
    <text class="muted s" x="16" y="88">same trace in,</text>
    <text class="muted s" x="16" y="106">same bytes out</text>
  </g>

  <text class="muted s" x="34" y="212">Every input above is declared and recorded. Nothing is inferred from the operator, the account, or the calendar.</text>

  <!-- Gate row -->
  <g transform="translate(16 262)">
    <rect class="card" x="0.5" y="0.5" width="927" height="52" rx="12"/>
    <text class="ink h" x="18" y="32">Ordered gate</text>
    <text class="muted s" x="118" y="32">integrity → safety → issuance. A failure at any position stops the one after it.</text>
    <circle class="accent" cx="700" cy="26" r="4"/>
    <text class="muted s" x="712" y="30">one lever, or MANUAL_REVIEW_REQUIRED</text>
  </g>
</svg>
