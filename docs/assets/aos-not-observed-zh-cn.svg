<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">没看到不等于零分</title>
  <desc id="desc">二十项指标只观察到三项，因此不签发正式分数。</desc>
  <rect width="1200" height="350" fill="#f0f1ee"/>
  <g font-family="system-ui,-apple-system,'Microsoft YaHei','PingFang SC',sans-serif">
    <text x="50" y="62" fill="#1a1c1a" font-size="35" font-weight="800">已观察</text><text x="50" y="129" fill="#0f5132" font-size="70" font-weight="850">3 / 20</text>
    <g transform="translate(50 170)"><rect x="0" y="0" width="46" height="46" rx="6" fill="#0f5132"/><rect x="58" y="0" width="46" height="46" rx="6" fill="#0f5132"/><rect x="116" y="0" width="46" height="46" rx="6" fill="#0f5132"/><g fill="none" stroke="#aab0aa" stroke-width="3" stroke-dasharray="7 6"><rect x="174" y="0" width="46" height="46" rx="6"/><rect x="232" y="0" width="46" height="46" rx="6"/><rect x="290" y="0" width="46" height="46" rx="6"/><rect x="348" y="0" width="46" height="46" rx="6"/><rect x="406" y="0" width="46" height="46" rx="6"/><rect x="464" y="0" width="46" height="46" rx="6"/><rect x="522" y="0" width="46" height="46" rx="6"/><rect x="580" y="0" width="46" height="46" rx="6"/><rect x="638" y="0" width="46" height="46" rx="6"/><rect x="696" y="0" width="46" height="46" rx="6"/><rect x="754" y="0" width="46" height="46" rx="6"/><rect x="812" y="0" width="46" height="46" rx="6"/><rect x="870" y="0" width="46" height="46" rx="6"/><rect x="928" y="0" width="46" height="46" rx="6"/><rect x="986" y="0" width="46" height="46" rx="6"/><rect x="1044" y="0" width="46" height="46" rx="6"/><rect x="1102" y="0" width="46" height="46" rx="6"/></g></g>
    <rect x="50" y="252" width="255" height="62" rx="8" fill="#a8322a"/><text x="177" y="293" fill="#fff" font-size="27" font-weight="800" text-anchor="middle">不出分</text>
    <text x="340" y="278" fill="#1a1c1a" font-size="27" font-weight="750">没看见，不等于没做到。</text><text x="340" y="314" fill="#5b615c" font-size="22">但沉默也不算通过。</text>
  </g>
