<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">没观察到，不等于 0 分</title><desc id="desc">二十项中只观察到三项。未观察项不是失败，因此不会签发分数。</desc><style> :root { color-scheme: light dark; } .bg { fill: #f0f1ee; } .panel { fill: #ffffff; stroke: #d5d8d2; } .ink { fill: #1a1c1a; } .muted { fill: #5b615c; } .sign { fill: #0f5132; } .sign-stroke { stroke: #0f5132; } .sign-ink { fill: #ffffff; color: #ffffff; } .line { stroke: #f2b705; } .stop { fill: #a8322a; } .stop-stroke { stroke: #a8322a; } .dash { stroke: #b7bdb7; } @media (prefers-color-scheme: dark) { .bg { fill: #141618; } .panel { fill: #1c1f21; stroke: #343a3d; } .ink { fill: #eceee9; } .muted { fill: #a9b0aa; } .sign { fill: #3f9a6b; } .sign-stroke { stroke: #3f9a6b; } .sign-ink { fill: #0b1410; color: #0b1410; } .stop { fill: #e0796e; } .stop-stroke { stroke: #e0796e; } .dash { stroke: #555d58; } } text { font-family: system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; } .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; } </style><rect class="bg" width="1200" height="430"/><text x="40" y="54" class="muted mono" font-size="23" font-weight="700">已观察 3 / 20</text><rect x="40" y="82" width="48" height="48" rx="7" class="sign"/><rect x="100" y="82" width="48" height="48" rx="7" class="sign"/><rect x="160" y="82" width="48" height="48" rx="7" class="sign"/><rect x="220" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="280" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="340" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="400" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="460" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="520" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="580" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="640" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="700" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="760" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="820" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="880" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="940" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="1000" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="1060" y="82" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="40" y="146" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><rect x="100" y="146" width="48" height="48" rx="7" fill="none" class="dash" stroke-width="3" stroke-dasharray="7 6"/><text x="40" y="240" class="muted" font-size="21">虚线不是失败，而是没有足够证据判断的项目。</text><g transform="translate(40 280) rotate(-2)"><rect width="210" height="66" rx="6" fill="none" class="stop-stroke" stroke-width="5"/><text x="105" y="43" text-anchor="middle" class="stop mono" font-size="28" font-weight="800">无分数</text></g><path d="M282 276v95" class="line" stroke-width="6"/><text x="314" y="318" class="ink" font-size="28" font-weight="800">沉默不等于通过。</text><text x="314" y="356" class="muted" font-size="21">看到得越少，分数反而越高的测量工具，实际上什么也没测到。</text></svg>
