<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">一般的なベンチマークと AOS は、違うものを測ります</title><desc id="desc">一般的なベンチマークはエージェントを比べ、AOS は利用者がどう運用したかを見ます。</desc><style> :root { color-scheme: light dark; } .bg { fill: #f0f1ee; } .panel { fill: #ffffff; stroke: #d5d8d2; } .ink { fill: #1a1c1a; } .muted { fill: #5b615c; } .sign { fill: #0f5132; } .sign-stroke { stroke: #0f5132; } .sign-ink { fill: #ffffff; color: #ffffff; } .line { stroke: #f2b705; } .stop { fill: #a8322a; } .stop-stroke { stroke: #a8322a; } .dash { stroke: #b7bdb7; } @media (prefers-color-scheme: dark) { .bg { fill: #141618; } .panel { fill: #1c1f21; stroke: #343a3d; } .ink { fill: #eceee9; } .muted { fill: #a9b0aa; } .sign { fill: #3f9a6b; } .sign-stroke { stroke: #3f9a6b; } .sign-ink { fill: #0b1410; color: #0b1410; } .stop { fill: #e0796e; } .stop-stroke { stroke: #e0796e; } .dash { stroke: #555d58; } } text { font-family: system-ui,-apple-system,'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif; } .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; } </style><rect class="bg" width="1200" height="310"/><rect x="42" y="34" width="530" height="242" rx="8" class="panel" stroke-width="3"/><text x="82" y="82" class="muted mono" font-size="18" font-weight="700" letter-spacing="3">BENCHMARK</text><text x="82" y="140" class="ink" font-size="38" font-weight="800">車を測ります</text><text x="82" y="194" class="muted" font-size="24">このモデルは別のモデルより</text><text x="82" y="230" class="muted" font-size="24">速く、正確か？</text><rect x="628" y="34" width="530" height="242" rx="8" class="panel sign-stroke" stroke-width="5"/><text x="668" y="82" class="sign mono" font-size="18" font-weight="700" letter-spacing="3">AOS</text><text x="668" y="140" class="ink" font-size="38" font-weight="800">運転を測ります</text><text x="668" y="194" class="muted" font-size="24">利用者は仕事をどう任せ、</text><text x="668" y="230" class="muted" font-size="24">監督し、確かめたか？</text></svg>
