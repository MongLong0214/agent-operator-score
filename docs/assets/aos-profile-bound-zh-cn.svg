    <rect x="40" y="38" width="455" height="255" rx="10" fill="#fff" stroke="#d5d8d2" stroke-width="3"/><text x="78" y="88" fill="#5b615c" font-size="19" font-family="ui-monospace,monospace">PROFILE A</text><text x="78" y="174" fill="#0f5132" font-size="88" font-weight="850">83</text><text x="78" y="225" fill="#1a1c1a" font-size="23">Codex · 沙箱开 · seed 1</text>
    <rect x="705" y="38" width="455" height="255" rx="10" fill="#fff" stroke="#d5d8d2" stroke-width="3"/><text x="743" y="88" fill="#5b615c" font-size="19" font-family="ui-monospace,monospace">PROFILE B</text><text x="743" y="174" fill="#0f5132" font-size="88" font-weight="850">83</text><text x="743" y="225" fill="#1a1c1a" font-size="23">Claude · 沙箱关 · seed 9</text>
