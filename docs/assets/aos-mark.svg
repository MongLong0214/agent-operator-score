<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="Agent Operator Score mark">
  <title>Agent Operator Score</title>
  <style>
    :root { color-scheme: light dark; }
    .plate { fill: #f8fafc; stroke: #e2e8f0; }
    .ring  { stroke: #cbd5e1; }
    .arc   { stroke: #2563eb; }
    .dot   { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #0f172a; stroke: #1e293b; }
      .ring  { stroke: #334155; }
      .arc   { stroke: #60a5fa; }
      .dot   { fill: #60a5fa; }
    }
  </style>
  <!-- A gauge whose arc deliberately stops short: the instrument reports a bounded,
       conditional reading, never a total. -->
  <rect class="plate" x="1" y="1" width="110" height="110" rx="26"/>
  <circle class="ring" cx="56" cy="56" r="33" fill="none" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="155.5 207.3" transform="rotate(135 56 56)"/>
  <circle class="arc" cx="56" cy="56" r="33" fill="none" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="93.3 269.5" transform="rotate(135 56 56)"/>
  <circle class="dot" cx="56" cy="56" r="6"/>
</svg>
