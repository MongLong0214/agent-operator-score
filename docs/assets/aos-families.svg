<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img"
     aria-label="The six coding task families AOS scores: intent, context, graph, loop and state, false completion, and recovery, safety and efficiency.">
  <title>The six coding task families</title>
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .card  { fill: #f8fafc; stroke: #e2e8f0; }
    .ink   { fill: #0f172a; }
    .muted { fill: #64748b; }
    .num   { fill: #2563eb; }
    .rule  { stroke: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0b1220; }
      .card  { fill: #0f172a; stroke: #1e293b; }
      .ink   { fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .num   { fill: #60a5fa; }
      .rule  { stroke: #1e293b; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .h { font-size: 14px; font-weight: 640; }
    .s { font-size: 11.5px; }
    .t { font-size: 10.5px; letter-spacing: 0.4px; font-weight: 600; }
    .n { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; }
  </style>

  <rect class="bg" width="960" height="252"/>
  <text class="muted t" x="20" y="28">SIX FAMILIES — WHAT AN OPERATOR IS SCORED ON</text>

  <g transform="translate(20 44)">
    <rect class="card" x="0.5" y="0.5" width="300" height="88" rx="12"/>
    <text class="num n" x="16" y="28">FAM-1</text>
    <text class="ink h" x="16" y="50">Intent</text>
    <text class="muted s" x="16" y="70">Did the operator state a task the agent could act on?</text>
  </g>
  <g transform="translate(330 44)">
    <rect class="card" x="0.5" y="0.5" width="300" height="88" rx="12"/>
    <text class="num n" x="16" y="28">FAM-2</text>
    <text class="ink h" x="16" y="50">Context</text>
    <text class="muted s" x="16" y="70">Was the agent given what the task actually required?</text>
  </g>
  <g transform="translate(640 44)">
    <rect class="card" x="0.5" y="0.5" width="300" height="88" rx="12"/>
    <text class="num n" x="16" y="28">FAM-3</text>
    <text class="ink h" x="16" y="50">Graph</text>
    <text class="muted s" x="16" y="70">Was the work decomposed and sequenced, or dumped?</text>
  </g>

  <g transform="translate(20 144)">
    <rect class="card" x="0.5" y="0.5" width="300" height="88" rx="12"/>
    <text class="num n" x="16" y="28">FAM-4</text>
    <text class="ink h" x="16" y="50">Loop &amp; state</text>
    <text class="muted s" x="16" y="70">Was a stall noticed, or did it run until the budget died?</text>
  </g>
  <g transform="translate(330 144)">
    <rect class="card" x="0.5" y="0.5" width="300" height="88" rx="12"/>
    <text class="num n" x="16" y="28">FAM-5</text>
    <text class="ink h" x="16" y="50">False completion</text>
    <text class="muted s" x="16" y="70">Was &#8220;done&#8221; checked, or believed?</text>
  </g>
  <g transform="translate(640 144)">
    <rect class="card" x="0.5" y="0.5" width="300" height="88" rx="12"/>
    <text class="num n" x="16" y="28">FAM-6</text>
    <text class="ink h" x="16" y="50">Recovery, safety, efficiency</text>
    <text class="muted s" x="16" y="70">After a failure: recovered, contained, and at what cost?</text>
  </g>
</svg>
