<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AOS が見る六つの領域</title>
  <desc id="desc">課題仕様、コンテキスト設計、分解とルーティング、人間参加制御、評価と検証、ガードレール復旧コストを実務上の質問で示します。</desc>
  <rect width="1200" height="650" fill="#f0f1ee"/>
  <g font-family="system-ui,-apple-system,&#x27;Hiragino Sans&#x27;,&#x27;Yu Gothic&#x27;,&#x27;Noto Sans JP&#x27;,sans-serif">
    <g transform="translate(30 30)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="47" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" letter-spacing=".6">D1 · TASK SPECIFICATION</text><text x="30" y="102" fill="#fff" font-size="30" font-weight="800"><tspan x="30" y="102">何を作るよう</tspan><tspan x="30" dy="37">伝えたか</tspan></text><text x="30" y="190" fill="#e5f1e9" font-size="20"><tspan x="30" y="190">目的、対象外、</tspan><tspan x="30" dy="34">完了条件。</tspan></text></g>
    <g transform="translate(420 30)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="47" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" letter-spacing=".6">D2 · CONTEXT ENGINEERING</text><text x="30" y="102" fill="#fff" font-size="30" font-weight="800">何を見せたか</text><text x="30" y="190" fill="#e5f1e9" font-size="20"><tspan x="30" y="190">必要で新しい情報か、</tspan><tspan x="30" dy="34">怪しい内容を除いたか。</tspan></text></g>
    <g transform="translate(810 30)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="47" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" letter-spacing=".6">D3 · DECOMPOSITION &amp; ROUTING</text><text x="30" y="102" fill="#fff" font-size="30" font-weight="800"><tspan x="30" y="102">仕事をどう</tspan><tspan x="30" dy="37">分けたか</tspan></text><text x="30" y="190" fill="#e5f1e9" font-size="20"><tspan x="30" y="190">担当と依存関係、</tspan><tspan x="30" dy="34">引き継ぎと統合。</tspan></text></g>
    <g transform="translate(30 330)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="47" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" letter-spacing=".6">D4 · HUMAN-IN-THE-LOOP CONTROL</text><text x="30" y="102" fill="#fff" font-size="30" font-weight="800"><tspan x="30" y="102">行き詰まったとき</tspan><tspan x="30" dy="37">何をしたか</tspan></text><text x="30" y="190" fill="#e5f1e9" font-size="20"><tspan x="30" y="190">気づき、介入し、</tspan><tspan x="30" dy="34">止めて再開できたか。</tspan></text></g>
    <g transform="translate(420 330)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="47" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" letter-spacing=".6">D5 · EVALUATION &amp; VERIFICATION</text><text x="30" y="102" fill="#fff" font-size="30" font-weight="800"><tspan x="30" y="102">本当に動くか</tspan><tspan x="30" dy="37">確かめたか</tspan></text><text x="30" y="190" fill="#e5f1e9" font-size="20"><tspan x="30" y="190">独立した根拠、正確な版、</tspan><tspan x="30" dy="34">誠実な完了報告。</tspan></text></g>
    <g transform="translate(810 330)"><rect width="360" height="270" rx="12" fill="#0f5132"/><text x="30" y="47" fill="#d7eadf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing=".6">D6 · GUARDRAILS, RECOVERY &amp; COST</text><text x="30" y="102" fill="#fff" font-size="30" font-weight="800"><tspan x="30" y="102">安全かつ無駄なく</tspan><tspan x="30" dy="37">進めたか</tspan></text><text x="30" y="190" fill="#e5f1e9" font-size="20"><tspan x="30" y="190">秘密情報、権限、復旧、</tspan><tspan x="30" dy="34">呼び出し予算。</tspan></text></g>
  </g>
</svg>
