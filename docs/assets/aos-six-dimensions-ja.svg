<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">AOS が見る六つの領域</title><desc id="desc">課題仕様、コンテキスト設計、分解と経路選択、ヒューマン・イン・ザ・ループ制御、評価と検証、ガードレール・復旧・コストを実務的な問いで示します。</desc><style> :root { color-scheme: light dark; } .bg { fill: #f0f1ee; } .panel { fill: #ffffff; stroke: #d5d8d2; } .ink { fill: #1a1c1a; } .muted { fill: #5b615c; } .sign { fill: #0f5132; } .sign-stroke { stroke: #0f5132; } .sign-ink { fill: #ffffff; color: #ffffff; } .line { stroke: #f2b705; } .stop { fill: #a8322a; } .stop-stroke { stroke: #a8322a; } .dash { stroke: #b7bdb7; } @media (prefers-color-scheme: dark) { .bg { fill: #141618; } .panel { fill: #1c1f21; stroke: #343a3d; } .ink { fill: #eceee9; } .muted { fill: #a9b0aa; } .sign { fill: #3f9a6b; } .sign-stroke { stroke: #3f9a6b; } .sign-ink { fill: #0b1410; color: #0b1410; } .stop { fill: #e0796e; } .stop-stroke { stroke: #e0796e; } .dash { stroke: #555d58; } } text { font-family: system-ui,-apple-system,'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif; } .mono { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; } </style><rect class="bg" width="1200" height="650"/><g transform="translate(30 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D1 · TASK SPECIFICATION</text><text x="30" y="101" class="sign-ink" font-size="27" font-weight="800"><tspan x="30">何を作るよう</tspan><tspan x="30" dy="36">頼んだか</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">目的、やらないこと、</tspan><tspan x="30" dy="32">完了とする条件。</tspan></text></g><g transform="translate(420 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D2 · CONTEXT ENGINEERING</text><text x="30" y="115" class="sign-ink" font-size="27" font-weight="800"><tspan x="30">何を見せたか</tspan></text><text x="30" y="168" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">関連性、鮮度、</tspan><tspan x="30" dy="32">信頼性のある資料。</tspan></text></g><g transform="translate(810 30)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="15" font-weight="700" letter-spacing="1.4">D3 · DECOMPOSITION &amp; ROUTING</text><text x="30" y="101" class="sign-ink" font-size="27" font-weight="800"><tspan x="30">仕事をどう</tspan><tspan x="30" dy="36">分けたか</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">担当、依存関係、</tspan><tspan x="30" dy="32">引き継ぎと合流。</tspan></text></g><g transform="translate(30 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D4 · HUMAN-IN-THE-LOOP CONTROL</text><text x="30" y="101" class="sign-ink" font-size="27" font-weight="800"><tspan x="30">詰まったとき</tspan><tspan x="30" dy="36">何をしたか</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">気づいたか、方針を変えたか、</tspan><tspan x="30" dy="32">止めるべきときに止めたか。</tspan></text></g><g transform="translate(420 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D5 · EVALUATION &amp; VERIFICATION</text><text x="30" y="101" class="sign-ink" font-size="27" font-weight="800"><tspan x="30">本当に動くか</tspan><tspan x="30" dy="36">確かめたか</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">「完了」を</tspan><tspan x="30" dy="32">別の根拠で確認したか。</tspan></text></g><g transform="translate(810 330)"><rect width="360" height="270" rx="12" class="sign"/><text x="30" y="48" class="sign-ink mono" font-size="14" font-weight="700" letter-spacing="1.4">D6 · GUARDRAILS, RECOVERY &amp; COST</text><text x="30" y="101" class="sign-ink" font-size="27" font-weight="800"><tspan x="30">安全に、無駄なく</tspan><tspan x="30" dy="36">進めたか</tspan></text><text x="30" y="184" class="sign-ink" font-size="20" opacity=".9"><tspan x="30">秘密、権限、復旧方法、</tspan><tspan x="30" dy="32">利用枠を守ったか。</tspan></text></g></svg>
