<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">못 본 것은 0점이 아닙니다</title>
  <desc id="desc">스무 개 중 세 개만 관찰된 채점표와 점수 없음 표시입니다. 관찰하지 못한 항목을 실패로 처리하지 않습니다.</desc>
  <rect width="1200" height="430" fill="#f0f1ee"/>
  <g font-family="system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <text x="40" y="54" fill="#5b615c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="23" font-weight="700">본 것 3 / 20</text>
    <g transform="translate(40 82)">
      <g fill="#0f5132">
        <rect x="0" y="0" width="48" height="48" rx="7"/><rect x="60" y="0" width="48" height="48" rx="7"/><rect x="120" y="0" width="48" height="48" rx="7"/>
      </g>
      <g fill="none" stroke="#b7bdb7" stroke-width="3" stroke-dasharray="7 6">
        <rect x="180" y="0" width="48" height="48" rx="7"/><rect x="240" y="0" width="48" height="48" rx="7"/><rect x="300" y="0" width="48" height="48" rx="7"/><rect x="360" y="0" width="48" height="48" rx="7"/><rect x="420" y="0" width="48" height="48" rx="7"/><rect x="480" y="0" width="48" height="48" rx="7"/><rect x="540" y="0" width="48" height="48" rx="7"/>
        <rect x="600" y="0" width="48" height="48" rx="7"/><rect x="660" y="0" width="48" height="48" rx="7"/><rect x="720" y="0" width="48" height="48" rx="7"/><rect x="780" y="0" width="48" height="48" rx="7"/><rect x="840" y="0" width="48" height="48" rx="7"/><rect x="900" y="0" width="48" height="48" rx="7"/><rect x="960" y="0" width="48" height="48" rx="7"/><rect x="1020" y="0" width="48" height="48" rx="7"/>
        <rect x="0" y="64" width="48" height="48" rx="7"/><rect x="60" y="64" width="48" height="48" rx="7"/>
      </g>
    </g>
    <text x="40" y="240" fill="#5b615c" font-size="21">점선은 틀린 항목이 아니라, 판단할 근거를 얻지 못한 항목입니다.</text>
    <g transform="translate(40 280) rotate(-2)">
      <rect width="190" height="66" rx="6" fill="none" stroke="#a8322a" stroke-width="5"/>
      <text x="95" y="43" text-anchor="middle" fill="#a8322a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="28" font-weight="800">점수 없음</text>
    </g>
    <path d="M282 276v95" stroke="#f2b705" stroke-width="6"/>
    <text x="314" y="318" fill="#1a1c1a" font-size="28" font-weight="800">침묵은 통과가 아닙니다.</text>
    <text x="314" y="356" fill="#5b615c" font-size="21">덜 볼수록 점수가 좋아지는 계측기는 아무것도 재고 있지 않습니다.</text>
  </g>
</svg>
