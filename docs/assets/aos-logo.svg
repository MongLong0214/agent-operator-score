<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96" role="img" aria-label="Agent Operator Score">
  <title>Agent Operator Score</title>
  <style>
    :root { color-scheme: light dark; }
    .ink   { fill: #0f172a; }
    .muted { fill: #64748b; }
    .ring  { stroke: #cbd5e1; }
    .arc   { stroke: #2563eb; }
    .dot   { fill: #2563eb; }
    .plate { fill: #f8fafc; stroke: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .ring  { stroke: #334155; }
      .arc   { stroke: #60a5fa; }
      .dot   { fill: #60a5fa; }
      .plate { fill: #0b1220; stroke: #1e293b; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Mark: a gauge that is deliberately not full. The arc stops short because the
       instrument reports a bounded, conditional reading rather than a total. -->
  <g transform="translate(8 8)">
    <rect class="plate" x="0.5" y="0.5" width="79" height="79" rx="18"/>
    <circle class="ring" cx="40" cy="40" r="24" fill="none" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="113 151" transform="rotate(135 40 40)"/>
    <circle class="arc" cx="40" cy="40" r="24" fill="none" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="68 196" transform="rotate(135 40 40)"/>
    <circle class="dot" cx="40" cy="40" r="4.5"/>
  </g>

  <g transform="translate(104 0)">
    <text class="ink" x="0" y="44" font-size="30" font-weight="650" letter-spacing="-0.4">Agent Operator Score</text>
    <text class="muted" x="0" y="68" font-size="14.5" letter-spacing="0.2">Measure the operator, not just the model.</text>
  </g>
</svg>
