<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">不测车，测驾驶者</title>
  <desc id="desc">把 agent 表示为车，把操作者表示为驾驶者，评分表的箭头指向操作者。</desc>
  <rect width="1200" height="380" fill="#f0f1ee"/>
  <rect x="24" y="250" width="1152" height="18" fill="#d5d8d2"/>
  <g stroke="#f2b705" stroke-width="9" stroke-linecap="round"><path d="M52 259h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78m46 0h78"/></g>
  <g fill="#fff" stroke="#1a1c1a" stroke-width="7" stroke-linejoin="round"><path d="M115 244v-45c0-10 8-18 18-18h45l37-47h105l23 47h41c10 0 18 8 18 18v45"/><circle cx="181" cy="244" r="24"/><circle cx="336" cy="244" r="24"/></g>
  <g fill="#fff" stroke="#1a1c1a" stroke-width="7" stroke-linecap="round"><circle cx="650" cy="116" r="40"/><path d="M588 244v-42c0-44 28-72 62-72s62 28 62 72v42"/></g>
  <g><rect x="886" y="72" width="236" height="178" rx="10" fill="#0f5132"/><g stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".86"><path d="M926 120h154M926 159h154M926 198h106"/></g><path d="M878 159H772" stroke="#0f5132" stroke-width="9" stroke-linecap="round"/><path d="M798 137l-24 22 24 22" fill="none" stroke="#0f5132" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g font-family="system-ui,-apple-system,'Microsoft YaHei','PingFang SC',sans-serif" font-size="27" font-weight="700" text-anchor="middle"><text x="258" y="310" fill="#5b615c">agent</text><text x="650" y="310" fill="#5b615c">操作者 · 你</text><text x="1004" y="310" fill="#0f5132">评分表</text></g>
  <text x="36" y="354" fill="#5b615c" font-family="system-ui,-apple-system,'Microsoft YaHei','PingFang SC',sans-serif" font-size="20">评分表指向的是驾驶者，不是车。</text>
</svg>
