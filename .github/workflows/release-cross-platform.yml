name: Release cross-platform

on:
  push:
    branches: [production-cli-phase-b]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aos-release-cross-platform
  cancel-in-progress: true

jobs:
  planning-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Assert finalized tree
        run: |
          test -f .release-ready.json
          test "$(node -p "require('./package.json').version")" = "0.1.0"
          test "$(node -p "require('./package.json').private")" = "false"
          test ! -e scripts/finalize-production.py
          test ! -e scripts/fix-production.py
          test ! -e scripts/fix-production-2.py
          test ! -e scripts/fix-production-3.py
          test ! -e scripts/fix-production-4.py
          test ! -e scripts/fix-production-5.py
          test ! -e scripts/fix-production-6.py
          test ! -e scripts/fix-production-7.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify

  macos:
    name: integration / macos / node-22
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.18.0
          cache: npm
      - run: test -f .release-ready.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:product
      - run: npm run verify
      - run: npm run pack:check

  package:
    name: package / clean-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.18.0
          cache: npm
      - run: test -f .release-ready.json
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check

  promote:
    name: promote verified production PR
    needs: [planning-contract, macos, package]
    runs-on: ubuntu-latest
    steps:
      - name: Mark ready and merge the exact verified head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pr=$(gh pr list --repo "${{ github.repository }}" --head production-cli-phase-b --base dev --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ]
          gh pr ready "$pr" --repo "${{ github.repository }}" || true
          gh pr merge "$pr" --repo "${{ github.repository }}" --squash --match-head-commit "$HEAD_SHA"
