name: Operational State

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      lane:
        description: Protected lane whose check run this dispatch mints
        required: true
        type: choice
        options:
          - review
          - authorization
      sha:
        description: Candidate head SHA (40 lowercase hex chars) the check binds to
        required: true
        type: string

permissions: {}

jobs:
  operational-state-offline:
    name: operational-state-offline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ops:check -- --offline
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run ops:render -- --check
      - name: Capture operational state JSON
        run: node scripts/resolve-execution-state.mjs --offline --json > operational-state.json
      - name: Write step summary
        run: |
          {
            echo "## operational-state-offline"
            echo
            echo '```'
            node scripts/resolve-execution-state.mjs --offline
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload operational state artifact
        uses: actions/upload-artifact@v4
        with:
          name: operational-state-offline
          path: operational-state.json

  operational-state-online:
    name: operational-state-online
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ops:check -- --offline
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run ops:render -- --check
      - name: Capture operational state JSON (online strict)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ops:status -- --strict --json > operational-state.json
      - name: Upload operational state artifact
        uses: actions/upload-artifact@v4
        with:
          name: operational-state-online
          path: operational-state.json

  dispatch-protected-check:
    name: dispatch-protected-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
      issues: read
    steps:
      - name: Validate dispatch context
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref }}
          LANE: ${{ inputs.lane }}
          SHA: ${{ inputs.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/dev" ]; then
            echo "refused: dispatch ref must be refs/heads/dev, got '$DISPATCH_REF'" >&2
            exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "refused: sha must be 40 lowercase hex characters, got '$SHA'" >&2
            exit 1
          fi
          case "$LANE" in
            review|authorization) ;;
            *) echo "refused: unknown lane '$LANE'" >&2; exit 1 ;;
          esac
          permission="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission')"
          if [ "$permission" != "maintain" ] && [ "$permission" != "admin" ]; then
            echo "refused: actor '$ACTOR' permission is '$permission'; maintain or admin required" >&2
            exit 1
          fi
          open_matches="$(gh api "repos/$REPO/pulls?state=open" --jq "[.[] | select(.head.sha == \"$SHA\")] | length")"
          if [ "$open_matches" != "1" ]; then
            echo "refused: sha '$SHA' is the head of $open_matches open PRs; exactly one required" >&2
            exit 1
          fi
      - name: Create protected check run
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$LANE" = "review" ]; then
            check_name="exact-head-review"
            external_prefix="aos-exact-head-review:"
          else
            check_name="exact-head-authorization"
            external_prefix="aos-exact-head-authorization:"
          fi
          gh api --method POST "repos/$REPO/check-runs" \
            -f name="$check_name" \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion=success \
            -f external_id="${external_prefix}${RUN_ID}:${RUN_ATTEMPT}"
