name: cleanup-readme-review-branch

on:
  push:
    branches:
      - docs/finalize-all-readmes

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove temporary review-only files and this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            docs/assets/.readme-localization-contract \
            docs/.readme-review-notes.md \
            .github/workflows/cleanup-readme-review-branch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary README review files"
          git push origin HEAD:docs/finalize-all-readmes
