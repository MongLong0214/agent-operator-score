name: Adapter contribution route
description: Record where a future adapter would land. This template does not accept a contribution.
title: "Adapter route: "
labels: ["adapter-route"]
body:
  - type: markdown
    attributes:
      value: >
        These routes document where an adapter or scenario would land. They do
        not accept external contributions while contributor terms are unresolved.
        MIT is the outbound license. It is not contributor terms and is not a
        publication clearance. Do not attach generated attribution, secrets,
        hidden reasoning, or hidden task answers.
  - type: input
    id: runtime
    attributes:
      label: Runtime the adapter would wrap
    validations:
      required: true
  - type: textarea
    id: landing
    attributes:
      label: Intended landing path under adapters/
      description: Existing runtimes live under adapters/codex/ and adapters/claude-code/.
    validations:
      required: true
